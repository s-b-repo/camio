<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Camio · a Cyber Sec tool</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/ui.css">
  <script src="/ui.js" defer></script>
</head>
<body>
  <div class="bg-grid" aria-hidden="true"></div>
  <canvas id="bg-canvas" aria-hidden="true"></canvas>
  <a class="skip" href="#main">Skip to workspace</a>
  <header class="topbar">
    <button class="nav-toggle ghost" id="nav-toggle" aria-expanded="false" aria-controls="rail">Menu</button>
    <button class="brand" type="button" data-go="status" aria-label="Camio, a Cyber Sec tool — overview">
      <span class="brand-mark" aria-hidden="true"><canvas id="globe-canvas" width="34" height="34"></canvas></span>
      <span class="brand-text">CAMIO<i>CYBER_SEC_</i></span>
    </button>
    <div class="crumb"><span>Workspace</span><span aria-hidden="true">/</span><strong id="current-page">Overview</strong></div>
    <div class="top-actions">
      <button class="ghost command-trigger" id="command-trigger" aria-haspopup="dialog" aria-keyshortcuts="Control+K Meta+K">Search tools <kbd>Ctrl K</kbd></button>
      <div class="status-chip" id="connection" data-state="connecting" role="status"><span class="signal" aria-hidden="true"></span><span id="connection-label">Connecting</span></div>
    </div>
  </header>
  <div class="shell">
    <aside class="rail" id="rail">
      <button class="workspace-switch" data-go="settings" type="button" aria-label="Workspace settings">
        <span class="workspace-icon" aria-hidden="true">C</span>
        <span><strong id="workspace-name">Local workspace</strong><small>Project settings</small></span>
        <span class="arrow" aria-hidden="true">›</span>
      </button>
      <nav id="nav" aria-label="Workbench"></nav>
    </aside>
    <main id="main" tabindex="-1">
      <div id="session-message" class="notice" role="alert" hidden></div>
      <div id="panels"></div>
    </main>
  </div>
  <dialog class="command" id="command-menu" aria-labelledby="command-title">
    <div class="dialog-heading">
      <h2 id="command-title">Search tools</h2>
      <button type="button" class="ghost" data-close="command-menu" aria-label="Close tool search">Esc</button>
    </div>
    <label class="sr-only" for="tool-search">Tool name</label>
    <input id="tool-search" type="search" placeholder="Find a tool or workspace view…" autocomplete="off">
    <div id="tool-results" class="command-results"></div>
  </dialog>
  <dialog class="inspector" id="inspector" aria-labelledby="inspector-title">
    <div class="dialog-heading">
      <h2 id="inspector-title">Exchange inspector</h2>
      <button type="button" class="ghost" data-close="inspector">Close</button>
    </div>
    <div id="inspector-content" class="inspector-content"></div>
  </dialog>
  <div class="sr-only" id="announcer" role="status" aria-live="polite"></div>
</body>
</html>
