[package]
name = "camio-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Camio's intercepting HTTP/HTTPS proxy: scope-gated capture, match & replace, and an intercept queue, with an optional operator-trusted TLS MITM CA (plan §F22/F05)."

[features]
# TLS interception (terminate the browser's TLS with Camio's own CA so HTTPS
# traffic can be inspected) is on by default. Build with `--no-default-features`
# for a pure HTTP proxy + blind HTTPS CONNECT tunnel with no server TLS stack.
default = ["tls-intercept"]
tls-intercept = ["dep:rustls", "dep:rcgen"]
# A ready-made `Forwarder` backed by Camio's fingerprint-matched request engine.
# Off by default so pure-injection embedders don't pull the engine; the CLI and
# native app enable it.
engine = ["dep:camio-request"]

[dependencies]
camio-core.workspace = true
httparse.workspace = true
rustls = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true, features = ["pem", "crypto", "aws_lc_rs", "x509-parser"] }
camio-request = { workspace = true, optional = true, features = ["impersonate"] }

[dev-dependencies]
camio-core.workspace = true
