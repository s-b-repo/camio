[package]
name = "camio-proxy"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "Camio's intercepting HTTP/HTTPS proxy: scope-gated capture, match & replace, and an intercept queue, with an optional operator-trusted TLS MITM CA (plan §F22/F05)."

[features]
# Everything on by default: TLS interception (terminate the browser's TLS with
# Camio's own CA so HTTPS traffic can be inspected) AND the engine-backed
# forwarder. Build with `--no-default-features` for a pure HTTP proxy + blind
# HTTPS CONNECT tunnel, or `--no-default-features -F tls-intercept` to drop just
# the engine.
default = ["tls-intercept", "engine"]
tls-intercept = ["dep:rustls", "dep:rcgen", "dep:time"]
# A ready-made `Forwarder` backed by Camio's fingerprint-matched request engine.
engine = ["dep:camio-request"]

[dependencies]
camio-core.workspace = true
httparse.workspace = true
rustls = { workspace = true, optional = true }
rcgen = { workspace = true, optional = true, features = ["pem", "crypto", "aws_lc_rs", "x509-parser"] }
time = { workspace = true, optional = true }
camio-request = { workspace = true, optional = true, features = ["impersonate"] }

[dev-dependencies]
camio-core.workspace = true
