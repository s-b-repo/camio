name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build & test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Native build deps: eframe/egui (windowing + xkb) for camio-app, and the
      # C toolchain for the bundled SQLite (rusqlite) and BoringSSL (camio-request).
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev cmake

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Clippy (deny warnings)
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      # Regex audit of the bad-pattern matrix (docs/BAD_PATTERNS.md), gated on
      # the sections that must always be zero: lint suppression, weak crypto and
      # injection. The other sections are advisory — every hit is a candidate
      # that has to be read in context, so `--strict` (all of A/B/C/L/M/N/O)
      # stays a manual review tool for now.
      - name: Bad-pattern audit (zero-tolerance sections)
        run: scripts/audit-bad-patterns.sh --zero "C L M"

      - name: Tests
        run: cargo test --workspace --all-features
