name: Build camio-browser (fork)

# Compiling a Firefox-family browser needs ~40 GB disk + hours of CPU — more than
# a dev laptop (or the default runner) has spare. So we offload it to GitHub:
# this job frees the runner's disk, installs the toolchain, and runs the fork
# build. It is MANUAL (workflow_dispatch) and EXPERIMENTAL — merging LibreWolf +
# Camoufox may need a patch reconciled; iterate here ("live edits" via CI) and
# re-run. The Camio app itself does not need this — it drives any Firefox-family
# binary and applies the theme/stealth at launch.

on:
  workflow_dispatch:
    inputs:
      librewolf_ref:
        description: "LibreWolf source git ref"
        default: "main"
      camoufox_ref:
        description: "Camoufox git ref (for stealth patches)"
        default: "main"
      camoufox_repo:
        description: "Camoufox SOURCE repo (upstream is suspended; leave blank to build LibreWolf + branding only)"
        default: ""

concurrency:
  group: browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build fork (long, experimental)
    runs-on: ubuntu-latest
    timeout-minutes: 350
    permissions:
      contents: write   # create the browser-v* release + upload the assets
    steps:
      - uses: actions/checkout@v4

      - name: Free runner disk space (~30 GB)
        run: |
          echo "before:"; df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/.ghcup /opt/hostedtoolcache/CodeQL \
                      /usr/local/share/boost "$AGENT_TOOLSDIRECTORY" || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          echo "after:"; df -h /

      - name: Install build prerequisites
        run: |
          # Node is already on the runner and `./mach bootstrap` installs the
          # rest of Firefox's toolchain — so do NOT pull `npm` from apt (its huge
          # node-* dependency tree is what flaked on security.ubuntu.com before).
          # Retry transient mirror hiccups rather than failing the whole build.
          sudo apt-get update -o Acquire::Retries=5
          for attempt in 1 2 3; do
            sudo apt-get install -y --no-install-recommends \
              -o Acquire::Retries=5 --fix-missing \
              git python3 python3-pip mercurial curl zip unzip \
              build-essential clang llvm pkg-config \
              libgtk-3-dev libdbus-glib-1-dev libasound2-dev \
              libpulse-dev libx11-xcb-dev m4 nasm && break
            echo "apt attempt $attempt failed; retrying after a pause"; sleep 20
          done
          node --version && python3 --version

      - name: Add swap (Firefox's dom/bindings + dom/canvas TUs OOM 16 GB)
        run: |
          # The default runner has ~16 GB RAM; Firefox's heaviest C++ TUs spike
          # past that in parallel. A 16 GB swapfile on /mnt lets them complete
          # (slower, not killed). /mnt still has ~50 GB left for the build.
          sudo swapoff -a || true
          sudo fallocate -l 16G /mnt/swapfile \
            || sudo dd if=/dev/zero of=/mnt/swapfile bs=1M count=16384
          sudo chmod 600 /mnt/swapfile
          sudo mkswap /mnt/swapfile
          sudo swapon /mnt/swapfile
          free -h; swapon --show

      - name: Build the fork (LibreWolf + Camoufox + Camio branding)
        working-directory: browser
        env:
          # Build on the larger ephemeral disk mounted at /mnt.
          MOZBUILD_STATE_PATH: /mnt/mozbuild
          CAMOUFOX_REPO: ${{ inputs.camoufox_repo }}
        run: |
          # /mnt is root-owned; make both the build dir and mach's state dir
          # ($MOZBUILD_STATE_PATH) writable by the build user.
          sudo mkdir -p /mnt/camio-browser-build /mnt/mozbuild
          sudo chown "$USER" /mnt/camio-browser-build /mnt/mozbuild
          ln -s /mnt/camio-browser-build build
          ./build.sh --full \
            --librewolf "${{ inputs.librewolf_ref }}" \
            --camoufox "${{ inputs.camoufox_ref }}" \
            --jobs "$(( $(nproc) > 3 ? 3 : $(nproc) ))" || echo "::warning::build.sh --full returned non-zero (see logs); uploading whatever was produced"

      - name: Collect artifacts
        if: always()
        run: |
          mkdir -p out
          # build.sh rebrands to camio-browser-*.tar.xz and a .deb; also keep the
          # raw librewolf-*.tar.xz and sweep obj-*/dist for any other output.
          find /mnt/camio-browser-build -maxdepth 2 \
               \( -name 'camio-browser-*.tar.*' -o -name 'camio-browser_*_amd64.deb' \
                  -o -name 'librewolf-*.tar.*' \) \
               -exec cp -v {} out/ \; 2>/dev/null || true
          find /mnt/camio-browser-build -path '*obj-*/dist/*' \
               \( -name '*.tar.*' -o -name '*.zip' -o -name '*.deb' \) \
               -exec cp -v {} out/ \; 2>/dev/null || true
          find /mnt/camio-browser-build -maxdepth 4 -name '*.log' \
               -exec cp -v {} out/ \; 2>/dev/null || true
          cp browser/branding/*.css browser/branding/*.json out/ 2>/dev/null || true
          ls -la out || true

      - name: Upload build output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: camio-browser
          path: out/**
          if-no-files-found: warn

      - name: Verify a browser was actually built
        run: |
          # A real build leaves librewolf-*.tar.xz (make package) or a binary under
          # obj-*/dist. Fail honestly if none exists, so a green check means a
          # browser — not just "the workflow ran".
          if find /mnt/camio-browser-build \
                  \( -name 'camio-browser-*.tar.*' -o -name 'librewolf-*.tar.*' \
                     -o \( -path '*obj-*/dist/*' \
                           \( -name 'librewolf' -o -name 'firefox' \
                              -o -name '*.tar.*' -o -name '*.zip' \) \) \) \
                  -print -quit 2>/dev/null | grep -q .; then
            echo "✓ built browser found"
          else
            echo "::error::No built browser produced — see the build log / uploaded artifact."
            echo "Common causes: Camoufox source unavailable (upstream suspended) is fine;"
            echo "a failed LibreWolf 'make build' is not. Iterate and re-run."
            exit 1
          fi

      - name: Publish a browser release (notes generated from the build)
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          TARBALL="$(ls camio-browser-*.tar.xz 2>/dev/null | head -1)"
          DEB="$(ls camio-browser_*_amd64.deb 2>/dev/null | head -1)"
          if [ -z "$TARBALL" ]; then echo "no camio-browser tarball; skipping release"; exit 0; fi
          VER="$(printf '%s' "$TARBALL" | sed -E 's/camio-browser-([0-9][^.]*\.[^.]*\.[^-]*-[0-9]+)\..*/\1/')"
          [ -n "$VER" ] || VER="$(date +%Y%m%d)"
          TAG="browser-v${VER}"
          {
            echo "# Camio Browser ${VER}"
            echo
            echo "A fingerprint-hardened **LibreWolf ${VER}** fork — themed black/blue and"
            echo "stealth-preconfigured — compiled from source in CI (\`.github/workflows/browser.yml\`)."
            echo
            echo "## Downloads"
            echo
            echo "| File | Size | SHA-256 |"
            echo "|------|------|---------|"
            for f in "$TARBALL" "$DEB"; do
              [ -n "$f" ] && [ -f "$f" ] && \
                printf '| `%s` | %s | `%s` |\n' "$f" "$(du -h "$f" | cut -f1)" "$(sha256sum "$f" | cut -d' ' -f1)"
            done
            echo
            echo "## Install"
            echo
            echo '```sh'
            echo "sudo apt install ./${DEB:-camio-browser_*.deb}   # or: sudo dpkg -i ${DEB:-*.deb} && sudo apt -f install"
            echo "camio-browser                                    # launches themed + hardened"
            echo '```'
            echo
            echo "Or extract the tarball and run \`./camio-browser/librewolf\`."
            echo
            echo "## What's baked in"
            echo
            echo "- Black/blue \`userChrome.css\` chrome, with \`lockPref\` enabling it"
            echo "- Extra hardening prefs (battery / netinfo / gamepad / beacon / DNS-prefetch / predictor off)"
            echo "- \`.desktop\` entry + icon (installed by the \`.deb\`); \`/usr/bin/camio-browser\` on PATH"
            echo "- Camoufox's C++ patches are **not** included (upstream suspended) — point Camio at a"
            echo "  prebuilt Camoufox binary for the C++ stealth layer; Camio themes/fingerprints it at launch."
            echo
            echo "_Built from commit \`${GITHUB_SHA}\` on $(date -u +%Y-%m-%d)._"
          } > notes.md
          ASSETS=""
          [ -n "$TARBALL" ] && [ -f "$TARBALL" ] && ASSETS="$ASSETS $TARBALL"
          [ -n "$DEB" ] && [ -f "$DEB" ] && ASSETS="$ASSETS $DEB"
          echo "release $TAG with assets:$ASSETS"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --notes-file notes.md --title "Camio Browser ${VER}"
            [ -n "$ASSETS" ] && gh release upload "$TAG" $ASSETS --clobber
          else
            gh release create "$TAG" $ASSETS --title "Camio Browser ${VER}" --notes-file notes.md
          fi
