name: Release binaries

# Every release ships ready-to-run binaries, compiled with EVERY feature
# enabled (`cargo build --release --all-features`). The version-bump/tag
# itself is handled by the reusable Release workflow; this job reacts to
# the published release (and can be run manually for any tag, or on a
# bare tag push) and attaches multi-target binaries.
#
# Targets:
#   * linux   x86_64  (ubuntu-latest, gnu)
#   * linux   aarch64 (ubuntu-latest + cross via `cross`)
#   * macOS   x86_64  (macos-13 — Intel runner)
#   * macOS   aarch64 (macos-14 — Apple Silicon runner)
#
# Each archive bundles:
#   * `camio` and `camio-app` binaries (all features on)
#   * `README.md`, `LICENSE`, `CHANGELOG.md`
#   * `docs/BUILDING.md`, `docs/PAYLOAD-DB.md`, `docs/AI-SAFETY.md`,
#     `docs/STEALTH.md`
#   * `payloads/DB/` — the pre-built SQLite catalog + base/*.txt sources
#   * a SHA-256 of the archive
#
# Note on triggers: a release created with the default GITHUB_TOKEN does
# not fire `release: published`. The central release workflow inherits
# secrets (a PAT), so it normally does — but if an auto-run is ever
# skipped, dispatch this manually with the tag, or it will also catch
# the bare tag push.

on:
  release:
    # `published` covers manual releases cut with a PAT.
    # `created`   covers releases cut server-side by the SemVer release
    #             workflow using the default GITHUB_TOKEN — otherwise
    #             those never fire a `push: tags` either, and this
    #             workflow would miss every bot-driven tag.
    types: [published, created]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to build + attach binaries to (e.g. v0.2.3)"
        required: true
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

concurrency:
  group: release-binaries-${{ github.event.release.tag_name || inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  # ------------------------------------------------------------------
  # Resolve the tag once so every matrix job sees the same string.
  # ------------------------------------------------------------------
  resolve:
    name: Resolve tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.r.outputs.tag }}
    steps:
      - name: Resolve
        id: r
        run: |
          TAG="${{ github.event.release.tag_name || inputs.tag || github.ref_name }}"
          [ -n "$TAG" ] || { echo "::error::no tag resolved"; exit 1; }
          case "$TAG" in v[0-9]*.[0-9]*.[0-9]*) ;; *) echo "::error::tag '$TAG' is not vMAJOR.MINOR.PATCH"; exit 1 ;; esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "resolved tag: $TAG"

  # ------------------------------------------------------------------
  # Build + package each target.
  # ------------------------------------------------------------------
  build:
    name: Build ${{ matrix.target.name }}
    needs: resolve
    runs-on: ${{ matrix.target.runner }}
    # Apple-Silicon runners are not always available to every account.
    # macos-aarch64 is marked `continue-on-error: true` via `required: false`
    # so a missing runner doesn't block the release — the three required
    # targets still publish. `fail-fast: false` keeps independent failures
    # from killing sibling jobs.
    continue-on-error: ${{ matrix.target.required == false }}
    strategy:
      fail-fast: false
      matrix:
        target:
          - name: linux-x86_64
            runner: ubuntu-latest
            triple: x86_64-unknown-linux-gnu
            cross: false
            required: true
          - name: linux-aarch64
            runner: ubuntu-latest
            triple: aarch64-unknown-linux-gnu
            # Native cross with apt-installed gcc-aarch64-linux-gnu +
            # explicit linker env; drops the `cross`-docker approach
            # which repeatedly fails to produce a working BoringSSL
            # build for us.
            cross: false
            apt_cross: true
            required: true
          - name: macos-x86_64
            runner: macos-13
            triple: x86_64-apple-darwin
            cross: false
            required: true
          - name: macos-aarch64
            runner: macos-14
            triple: aarch64-apple-darwin
            cross: false
            required: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      # ------- platform system dependencies -------
      - name: Install Linux build deps (native x86_64 — includes GUI deps)
        if: matrix.target.name == 'linux-x86_64'
        run: |
          sudo apt-get update -o Acquire::Retries=5
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libwayland-dev cmake clang pkg-config

      - name: Install Linux build deps (aarch64 cross-compiler via apt)
        if: matrix.target.name == 'linux-aarch64'
        run: |
          sudo apt-get update -o Acquire::Retries=5
          # The Rust toolchain brings libstd for the target; we only need
          # the C cross-compiler + cmake so BoringSSL can link, and
          # pkg-config for rusqlite's bundled SQLite.
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            cmake clang pkg-config

      # ------- Rust toolchain + target -------
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target.triple }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.target.triple }}

      # ------- Build -------
      - name: Compile
        env:
          # Help eframe/egui find system libs on Linux; no-op on macOS.
          PKG_CONFIG_ALLOW_SYSTEM_LIBS: "1"
          # Teach cargo/cc which C toolchain to use for the aarch64 target.
          # These env vars are harmless on other targets because they're
          # key'd by triple.
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER: aarch64-linux-gnu-gcc
          CC_aarch64_unknown_linux_gnu: aarch64-linux-gnu-gcc
          CXX_aarch64_unknown_linux_gnu: aarch64-linux-gnu-g++
          AR_aarch64_unknown_linux_gnu: aarch64-linux-gnu-ar
        run: |
          if [ "${{ matrix.target.name }}" = "linux-aarch64" ]; then
            # egui/winit need system X11/Wayland headers for the target
            # architecture that aren't trivially available in an apt-based
            # cross-compile. Ship CLI + MCP + web UI for aarch64; users who
            # want the GUI build it natively from source on their aarch64
            # box (documented in docs/BUILDING.md).
            cargo build --release --all-features \
              -p camio-cli -p camio-mcp -p camio-web \
              --target ${{ matrix.target.triple }}
          else
            cargo build --workspace --release --all-features --bins \
              --target ${{ matrix.target.triple }}
          fi

      # ------- stage archive directory -------
      - name: Stage
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          TAG="${{ needs.resolve.outputs.tag }}"
          NAME="camio-${TAG}-${{ matrix.target.name }}"
          mkdir -p "$NAME"
          # Binaries (may be absent on cross builds that excluded camio-app).
          found=0
          for b in camio camio-app; do
            path="target/${{ matrix.target.triple }}/release/${b}"
            if [ -x "$path" ]; then
              cp "$path" "$NAME/"
              found=1
            fi
          done
          [ "$found" = 1 ] || { echo "::error::no binaries built for ${{ matrix.target.name }}"; exit 1; }

          # Docs + license + changelog (if present in the tagged commit).
          for f in README.md LICENSE CHANGELOG.md \
                   docs/BUILDING.md docs/PAYLOAD-DB.md docs/AI-SAFETY.md docs/STEALTH.md; do
            [ -f "$f" ] && cp "$f" "$NAME/" || true
          done

          # Payload DB (source of truth + pre-built SQLite).
          if [ -d payloads/DB ]; then
            mkdir -p "$NAME/payloads/DB"
            cp -r payloads/DB/base "$NAME/payloads/DB/" 2>/dev/null || true
            cp payloads/DB/README.md "$NAME/payloads/DB/" 2>/dev/null || true
            cp payloads/DB/catalog.json "$NAME/payloads/DB/" 2>/dev/null || true
            cp payloads/DB/payloads.sqlite "$NAME/payloads/DB/" 2>/dev/null || true
          fi

          # Archive + checksum.
          tar -czf "${NAME}.tar.gz" "$NAME"
          # BSD/GNU shasum compat: `sha256sum` on linux, `shasum -a 256` on macOS.
          if command -v sha256sum >/dev/null 2>&1; then
            sha256sum "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          else
            shasum -a 256 "${NAME}.tar.gz" > "${NAME}.tar.gz.sha256"
          fi
          cat "${NAME}.tar.gz.sha256"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Built archive for ${{ matrix.target.name }}:"
          ls -la "$NAME"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.stage.outputs.name }}
          path: |
            ${{ steps.stage.outputs.name }}.tar.gz
            ${{ steps.stage.outputs.name }}.tar.gz.sha256
          if-no-files-found: error

  # ------------------------------------------------------------------
  # Attach every built archive to the GitHub Release in one step so the
  # release page lists them together.
  #
  # `if: always()` + the `success()||failure()` guard mean: if at least
  # one matrix job produced an artifact (even if a sibling failed or was
  # cancelled — e.g. missing macos-aarch64 runner), still attach what
  # we've got. A completely dead matrix skips attach cleanly.
  # ------------------------------------------------------------------
  attach:
    name: Attach to release
    needs: [resolve, build]
    if: always() && needs.resolve.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}

      - name: Download all built archives
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Publish to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="${{ needs.resolve.outputs.tag }}"
          # If the trigger was a bare tag push with no release yet, make one.
          gh release view "$TAG" >/dev/null 2>&1 \
            || gh release create "$TAG" --title "$TAG" --generate-notes
          cd dist
          ls -la
          # Count artifacts; nothing to upload is not an error (the
          # matrix may be mid-rollout). Upload only what exists.
          shopt -s nullglob
          archives=(*.tar.gz)
          sums=(*.tar.gz.sha256)
          if [ ${#archives[@]} -eq 0 ]; then
            echo "::warning::no archives produced for $TAG — nothing to attach"
            exit 0
          fi
          gh release upload "$TAG" "${archives[@]}" "${sums[@]}" --clobber
          echo "attached ${#archives[@]} archive(s) to release $TAG"
