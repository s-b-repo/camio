# Configuration for GitHub's auto-generated release notes.
# Applies when releases are cut by .github/workflows/release.yml (--generate-notes).
# Categories group merged PRs by label; direct-to-main commits are listed flat.
changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - github-actions
      - github-actions[bot]
      - dependabot
      - dependabot[bot]
  categories:
    - title: 🚀 Features
      labels: [feature, feat, enhancement]
    - title: 🐛 Fixes
      labels: [fix, bug, bugfix]
    - title: 🔒 Security
      labels: [security]
    - title: 📚 Documentation
      labels: [docs, documentation]
    - title: 🧰 Maintenance & other changes
      labels: ["*"]
