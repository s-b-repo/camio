# Camio — Rust workspace
# A local-first, fingerprint-transparent web security testing workbench.
# See plan.md for the full product plan.

[workspace]
resolver = "2"
members = [
    "crates/camio-core",
    "crates/camio-engine",
    "crates/camio-cli",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
# Provisional: Camio builds on Camoufox (MPL-2.0). Final license is decided in
# plan.md §12 after full dependency review.
license = "MPL-2.0"
authors = ["Camio contributors"]
repository = ""
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
zip = "2"

[profile.release]
lto = "thin"
strip = true
