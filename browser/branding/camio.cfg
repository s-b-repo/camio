// camio.cfg — autoconfig defaults baked into the camio-browser fork.
// Installed as <app>/camio.cfg with a defaults/pref/autoconfig.js that points
// at it (general.config.filename = "camio.cfg"; general.config.obscure_value = 0).
// These make the black/blue Camio theme + pref-level stealth the out-of-box
// default; the Camoufox C++ patches (when available) provide engine-level
// stealth below the JS layer.
//
// NOTE: lockPref() prevents the user (and remote-config) from flipping the
// pref back off — reserve it for the identity-critical toggles. defaultPref()
// is a softer default the user can still change.

// --- Theme: enable the Camio userChrome.css shipped into each profile. ------
lockPref("toolkit.legacyUserProfileCustomizations.stylesheets", true);

// --- Automation tell: hidden, but Marionette stays usable. ------------------
// (useAutomationExtension is a ChromeDriver capability, not a Firefox pref.)
lockPref("dom.webdriver.enabled", false);

// --- Fingerprint policy baseline (matches FingerprintPolicy::balanced). -----
defaultPref("privacy.resistFingerprinting", true);
// false = allow readback but let RFP return RANDOMIZED pixels (Randomize mode).
// true would auto-decline → a blank canvas, which is itself a tell.
defaultPref("privacy.resistFingerprinting.autoDeclineNoUserInputCanvasPrompts", false);
// spoof_english is correct here because the baked-in persona is en-US; a
// non-English persona applied by Camio's launcher omits it.
defaultPref("privacy.spoof_english", 2);
defaultPref("privacy.reduceTimerPrecision", true);
defaultPref("privacy.resistFingerprinting.reduceTimerPrecision.jitter", true);
defaultPref("privacy.resistFingerprinting.reduceTimerPrecision.microseconds", 2000);

// --- WebRTC leak protection. ------------------------------------------------
defaultPref("media.peerconnection.ice.default_address_only", true);
defaultPref("media.peerconnection.ice.no_host", true);
defaultPref("media.peerconnection.ice.proxy_only_if_behind_proxy", true);

// --- Extended stealth: close non-RFP vectors. -------------------------------
defaultPref("dom.battery.enabled", false);
defaultPref("dom.netinfo.enabled", false);
defaultPref("dom.gamepad.enabled", false);
defaultPref("media.webspeech.synth.enabled", false);
defaultPref("beacon.enabled", false);
defaultPref("network.dns.disablePrefetch", true);
defaultPref("network.predictor.enabled", false);
defaultPref("webgl.enable-debug-renderer-info", false);
defaultPref("geo.enabled", false);
defaultPref("geo.provider.network.url", "");

// --- Tracking protection + cookie partitioning. -----------------------------
defaultPref("privacy.trackingprotection.enabled", true);
defaultPref("privacy.trackingprotection.fingerprinting.enabled", true);
defaultPref("privacy.trackingprotection.cryptomining.enabled", true);
defaultPref("privacy.trackingprotection.socialtracking.enabled", true);
defaultPref("network.cookie.cookieBehavior", 5);

// --- Phone-home / telemetry silence. ----------------------------------------
defaultPref("app.update.auto", false);
defaultPref("datareporting.healthreport.uploadEnabled", false);
defaultPref("datareporting.policy.dataSubmissionEnabled", false);
defaultPref("toolkit.telemetry.enabled", false);
defaultPref("toolkit.telemetry.unified", false);
defaultPref("app.normandy.enabled", false);
defaultPref("app.shield.optoutstudies.enabled", false);
defaultPref("browser.discovery.enabled", false);
defaultPref("network.connectivity-service.enabled", false);
defaultPref("network.captive-portal-service.enabled", false);

// --- Honest branding. -------------------------------------------------------
defaultPref("browser.shell.checkDefaultBrowser", false);
defaultPref("browser.newtabpage.activity-stream.showSponsored", false);
defaultPref("browser.newtabpage.activity-stream.showSponsoredTopSites", false);
defaultPref("extensions.pocket.enabled", false);
