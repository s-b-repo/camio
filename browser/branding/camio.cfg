// camio.cfg — autoconfig defaults baked into the camio-browser fork.
// Installed as <app>/camio.cfg with a defaults/pref/autoconfig.js that points at
// it (general.config.filename = "camio.cfg"; general.config.obscure_value = 0).
// These make the black/blue Camio theme and pref-level stealth the out-of-box
// default; the Camoufox C++ patches provide the engine-level stealth.

// Enable userChrome.css (branding/userChrome.css is shipped in the default profile).
defaultPref("toolkit.legacyUserProfileCustomizations.stylesheets", true);

// Don't phone home / nag — Camio is for authorized local testing.
defaultPref("app.update.auto", false);
defaultPref("datareporting.healthreport.uploadEnabled", false);
defaultPref("toolkit.telemetry.enabled", false);

// Honest branding.
defaultPref("browser.shell.checkDefaultBrowser", false);
